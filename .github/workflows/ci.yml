name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: '1'
  PYTHON_VERSION: '3.12'

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: Install Chromium for the JS-rendered site test
        run: uv run playwright install --with-deps chromium
      - name: pytest (all tests, including browser)
        env:
          # Fail, don't skip, if Chromium can't launch: a broken install must not hide the JS tests.
          REQUIRE_BROWSER_TESTS: '1'
        run: uv run pytest -n auto --cov --cov-report=term --cov-report=xml
      - name: Core coverage gate (>= 90%)
        run: uv run coverage report --include='src/scraping_pipeline/core/*' --fail-under=90
      - name: Stages, sites and CLI coverage gate (>= 90%)
        run: >-
          uv run coverage report --fail-under=90
          --include='src/scraping_pipeline/stages/*,src/scraping_pipeline/sites/*,src/scraping_pipeline/cli.py'
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  smoke:
    name: Demo and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: make demo (offline, against the local fixture server)
        run: make demo
      - name: docker build
        run: docker build -t resilient-scraping-pipeline:ci .
      - name: docker run
        run: docker run --rm resilient-scraping-pipeline:ci version
