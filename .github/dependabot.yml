version: 2
updates:
  # uv.lock + pyproject.toml. Minor and patch updates come grouped, once a week.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades change behaviour (pydantic, DuckDB, Playwright have all broken APIs across
    # majors). They are taken by hand, with the changelog read and the tests extended, not merged
    # from a bot PR.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
