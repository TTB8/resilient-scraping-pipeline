[project]
name = "resilient-scraping-pipeline"
version = "0.1.0"
description = "A polite, resumable, reproducible web data pipeline: discover, fetch, parse, validate, export."
authors = [{ name = "TTB8", email = "194136919+TTB8@users.noreply.github.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "pyarrow>=26.0.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "selectolax>=1.0.2",
    "structlog>=26.1.0",
    "typer>=0.29.2",
]

[project.scripts]
pipeline = "scraping_pipeline.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scraping_pipeline"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Generated by harness-kit and regenerated on every install: not this project's code.
extend-exclude = ["scripts/harness"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "RET", "ARG", "PL", "TRY", "DTZ", "ASYNC"]
ignore = ["PLR0913", "TRY003", "E501"]  # E501: the formatter owns code width; prose may run long

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "ARG001"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# pyarrow ships no type stubs. Scoped here instead of `type: ignore` on every import.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A stuck real-time test (a scheduler that never finishes) fails after 60s instead of hanging CI.
timeout = 60
markers = [
    "browser: needs Playwright Chromium installed",
    "slow: heavy property tests; skipped by the fast harness check, run in full and CI",
]

[tool.coverage.run]
source = ["scraping_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.6",
]
